<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GenAI Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --font-ui:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --font-mono:'Roboto Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --ts-1:12px; --ts-2:13px; --ts-3:15px; --ts-4:19px; --ts-5:26px;
  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:24px; --s-6:32px; --s-7:48px;
  --r-xs:4px; --r-sm:6px; --r-md:10px; --r-lg:14px; --r-pill:999px;
  --navy-900:#0d1f3c; --navy-700:#173259; --navy-500:#2a4a7a; --navy-300:#5a7db0;
  --green-600:#1f8a5b; --green-500:#25a06a; --green-100:#dff2e8;
  --blue-500:#3d4fd4; --blue-600:#2f3fb8; --blue-100:#e6e9fb;
  --ok:#1f8a5b; --ok-bg:#dff2e8; --issue:#c0392b; --issue-bg:#fbe4e4; --cash:#9a7212; --cash-bg:#f6edcf;
  --purple:#5b21b6; --purple-bg:#ede9fb;
  --amber:#e8a93b;
  --bg:#f5f7fa; --surface:#ffffff; --surface-2:#eef1f6;
  --border:#e2e7ef; --border-strong:#cfd7e3;
  --text:#132139; --text-muted:#5c6b84; --text-inverse:#ffffff;
  --brand:var(--navy-900); --accent:var(--navy-700);
  --add:#dff2e8; --add-t:#1f8a5b; --del:#fbe4e4; --del-t:#c0392b;
  --shadow:0 1px 2px rgba(19,33,57,.06),0 6px 20px rgba(19,33,57,.06);
  --shadow-lift:0 2px 4px rgba(19,33,57,.08),0 14px 34px rgba(19,33,57,.12);
}
:root[data-theme="dark"]{
  --navy-300:#93b0dd;
  --green-500:#31b57c; --green-600:#26a06d; --green-100:#123527;
  --blue-100:#1c2450; --blue-600:#5566e6;
  --ok:#4fd48a; --ok-bg:#12351f; --issue:#e88a8a; --issue-bg:#3a1616; --cash:#e2b466; --cash-bg:#3a2c14;
  --purple:#b79cf0; --purple-bg:#241a3d;
  --bg:#0a1526; --surface:#10203a; --surface-2:#14284a;
  --border:#20355a; --border-strong:#2b4670;
  --text:#e9eef7; --text-muted:#9db0cd; --text-inverse:#0a1526;
  --brand:#e9eef7; --accent:#93b0dd;
  --add:#12351f; --add-t:#4fd48a; --del:#3a1616; --del-t:#e88a8a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  --shadow-lift:0 2px 6px rgba(0,0,0,.4),0 18px 40px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--font-ui);color:var(--text);background:var(--bg);font-size:var(--ts-3);line-height:1.45;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
input,textarea,select{font-family:inherit}
:focus-visible{outline:2px solid var(--green-500);outline-offset:2px;border-radius:var(--r-xs)}
h2,h3,h4{letter-spacing:-.01em}

.app{display:grid;grid-template-columns:264px 1fr;min-height:100vh}

/* Sidebar */
.sidebar{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:var(--s-3);padding:var(--s-5) var(--s-5) var(--s-4);cursor:pointer}
.brand .mark{width:34px;height:34px;border-radius:var(--r-md);background:var(--brand);color:var(--text-inverse);display:grid;place-items:center;font-weight:700;flex:none}
.brand h1{margin:0;font-size:var(--ts-4);letter-spacing:-.01em;font-weight:700}
.brand small{display:block;color:var(--text-muted);font-size:var(--ts-1);font-weight:500;margin-top:1px}
.side-nav{flex:1;overflow-y:auto;padding:0 var(--s-3) var(--s-4)}
.nav-link{display:flex;align-items:center;gap:var(--s-3);width:100%;border:0;background:none;color:var(--text);padding:var(--s-2) var(--s-3);border-radius:var(--r-sm);font-size:var(--ts-3);text-align:left;font-weight:500}
.nav-link:hover{background:var(--surface-2)}
.nav-link.active{background:var(--blue-100);color:var(--accent)}
.nav-link svg{width:18px;height:18px;flex:none}
.side-section{margin-top:var(--s-5)}
.side-section .head{display:flex;align-items:center;justify-content:space-between;padding:0 var(--s-3) var(--s-2)}
.side-section .head span{font-size:var(--ts-1);letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);font-weight:600}
.side-section .head .count{background:var(--surface-2);color:var(--text-muted);border-radius:var(--r-pill);padding:1px 7px;font-size:var(--ts-1);font-weight:600}
.fav-list{display:flex;flex-direction:column;gap:2px}
.fav{display:flex;align-items:center;gap:var(--s-3);padding:var(--s-2) var(--s-3);border-radius:var(--r-sm);border:1px solid transparent;cursor:pointer}
.fav:hover{background:var(--surface-2)}
.fav.dragging{opacity:.5}
.fav.drop-target{border-color:var(--green-500);background:var(--green-100)}
.fav .grip{color:var(--border-strong);cursor:grab;display:grid;place-items:center;flex:none}
.fav:hover .grip{color:var(--text-muted)}
.fav .ic{width:26px;height:26px;border-radius:var(--r-sm);display:grid;place-items:center;flex:none}
.fav .nm{flex:1;font-size:var(--ts-2);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fav .unpin{border:0;background:none;color:var(--text-muted);opacity:0;padding:2px;border-radius:var(--r-xs);display:grid;place-items:center}
.fav:hover .unpin{opacity:1}
.fav .unpin:hover{color:var(--brand);background:var(--surface)}
.fav-empty{padding:var(--s-3);color:var(--text-muted);font-size:var(--ts-2);line-height:1.4}
.side-foot{border-top:1px solid var(--border);padding:var(--s-3);display:flex;align-items:center;gap:var(--s-2)}
.side-foot .user{display:flex;align-items:center;gap:var(--s-3);flex:1;padding:var(--s-2) var(--s-3);border-radius:var(--r-sm)}
.side-foot .avatar{width:28px;height:28px;border-radius:var(--r-pill);background:var(--blue-500);color:#fff;display:grid;place-items:center;font-size:var(--ts-1);font-weight:600;flex:none}
.side-foot .user b{font-size:var(--ts-2);font-weight:600;display:block}
.side-foot .user small{font-size:var(--ts-1);color:var(--text-muted)}
.icon-btn{border:1px solid var(--border);background:var(--surface);color:var(--text-muted);width:34px;height:34px;border-radius:var(--r-sm);display:grid;place-items:center;flex:none}
.icon-btn:hover{color:var(--brand);border-color:var(--border-strong)}

/* Main */
.main{display:flex;flex-direction:column;min-width:0}
.topbar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:var(--s-4);padding:var(--s-4) var(--s-6);min-height:65px}
.search{position:relative;flex:1;max-width:560px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--green-600)}
.search input{width:100%;padding:11px 44px 11px 42px;border-radius:var(--r-pill);border:1.5px solid var(--border-strong);background:var(--surface);color:var(--text);font-size:var(--ts-3);transition:border-color .12s,box-shadow .12s}
.search input::placeholder{color:var(--text-muted)}
.search input:focus{outline:none;border-color:var(--green-500);box-shadow:0 0 0 4px var(--green-100)}
.search kbd{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-family:var(--font-mono);font-size:11px;color:var(--text-muted);border:1px solid var(--border-strong);border-radius:var(--r-xs);padding:1px 6px;background:var(--surface-2)}
.crumb{display:flex;align-items:center;gap:var(--s-3);font-size:var(--ts-3)}
.crumb .back{border:1px solid var(--border);background:var(--surface);color:var(--text);width:34px;height:34px;border-radius:var(--r-sm);display:grid;place-items:center}
.crumb .back:hover{border-color:var(--border-strong)}
.crumb .path{color:var(--text-muted)}
.crumb .path b{color:var(--text);font-weight:600}

.content{padding:var(--s-6);max-width:1400px;width:100%;margin:0 auto}

/* Catalogue */
.page-head{margin-bottom:var(--s-5)}
.page-head h2{margin:0 0 var(--s-2);font-size:var(--ts-5);font-weight:700}
.page-head p{margin:0;color:var(--text-muted);max-width:60ch}
.filters{display:flex;gap:var(--s-2);flex-wrap:wrap;margin-bottom:var(--s-6)}
.chip-filter{border:1px solid var(--border-strong);background:var(--surface);color:var(--text);padding:7px 14px;border-radius:var(--r-pill);font-size:var(--ts-2);font-weight:500;display:inline-flex;align-items:center;gap:7px}
.chip-filter:hover{border-color:var(--navy-300)}
.chip-filter.active{background:var(--navy-900);color:#fff;border-color:var(--navy-900)}
.chip-filter .n{font-size:11px;background:var(--surface-2);color:var(--text-muted);border-radius:var(--r-pill);padding:0 6px;font-weight:600}
.chip-filter.active .n{background:rgba(255,255,255,.18);color:#fff}

.featured{border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;background:linear-gradient(135deg,var(--navy-900),var(--navy-700));color:#fff;box-shadow:var(--shadow);margin-bottom:var(--s-7)}
.featured .inner{display:flex;gap:var(--s-6);align-items:center;padding:var(--s-6);flex-wrap:wrap}
.featured .badge{display:inline-flex;align-items:center;gap:6px;font-size:var(--ts-1);font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:#bcd0f0;margin-bottom:var(--s-3)}
.featured h3{margin:0 0 var(--s-2);font-size:var(--ts-5)}
.featured p{margin:0 0 var(--s-4);color:#c8d6ee;max-width:52ch}
.featured .flow{display:flex;gap:var(--s-2);flex-wrap:wrap}
.featured .step{font-size:var(--ts-2);font-weight:500;color:#e7eefb;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.16);padding:5px 12px;border-radius:var(--r-pill)}
.featured .cta-wrap{margin-left:auto;display:flex;flex-direction:column;gap:var(--s-2);align-items:flex-end}
.btn-primary{background:var(--navy-900);color:#fff;border:0;padding:11px 20px;border-radius:var(--r-sm);font-weight:600;font-size:var(--ts-3);display:inline-flex;align-items:center;gap:8px}
.btn-primary svg{width:15px;height:15px;flex:none}
.btn-primary:hover{background:var(--navy-700)}
.featured .btn-primary{background:#fff;color:var(--navy-900)}
.featured .btn-primary:hover{background:#eef2fb}
.pin-solution{background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.22);color:#e7eefb;padding:8px 14px;border-radius:var(--r-sm);font-size:var(--ts-2);font-weight:500;display:inline-flex;gap:6px;align-items:center}
.pin-solution:hover{background:rgba(255,255,255,.18)}
.pin-solution.on{background:#fff;color:var(--navy-900);border-color:#fff}

.cluster{margin-bottom:var(--s-7)}
.cluster-head{display:flex;align-items:baseline;gap:var(--s-3);margin-bottom:var(--s-4)}
.cluster-head h3{margin:0;font-size:var(--ts-4);font-weight:700}
.cluster-head p{margin:0;color:var(--text-muted);font-size:var(--ts-2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:var(--s-4)}
.card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:var(--s-5);box-shadow:var(--shadow);transition:transform .12s,box-shadow .12s,border-color .12s;display:flex;flex-direction:column;gap:var(--s-3);cursor:pointer}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift);border-color:var(--border-strong)}
.card .ic{width:42px;height:42px;border-radius:var(--r-md);display:grid;place-items:center}
.card h4{margin:0;font-size:var(--ts-3);font-weight:600}
.card p{margin:0;color:var(--text-muted);font-size:var(--ts-2);line-height:1.4;flex:1}
.card .chip{align-self:flex-start;font-size:var(--ts-1);font-weight:600;color:var(--text-muted);background:var(--surface-2);padding:3px 9px;border-radius:var(--r-pill)}
.card .pin{position:absolute;top:var(--s-3);right:var(--s-3);border:0;background:none;color:var(--border-strong);padding:4px;border-radius:var(--r-xs);display:grid;place-items:center;transition:color .12s,transform .12s}
.card .pin:hover{color:var(--navy-500);transform:scale(1.1)}
.card .pin.on{color:var(--amber)}
.card .pin.on svg{fill:var(--amber)}
.t-solution{background:var(--navy-900);color:#fff}
.t-rex{background:var(--blue-100);color:var(--blue-500)}
.t-documents{background:var(--green-100);color:var(--green-600)}
.t-assistants{background:#fbeede;color:#c78a2e}
:root[data-theme="dark"] .t-assistants{background:#3a2c14;color:#e2b466}
.empty{text-align:center;padding:var(--s-7) var(--s-4);color:var(--text-muted)}
.empty svg{width:40px;height:40px;color:var(--border-strong);margin-bottom:var(--s-3)}
.empty h3{margin:0 0 var(--s-2);color:var(--text);font-size:var(--ts-4)}
.empty button{margin-top:var(--s-4);background:none;border:1px solid var(--border-strong);color:var(--text);padding:8px 16px;border-radius:var(--r-sm);font-weight:500}

/* ---------- Tool screen shared ---------- */
.tool-head{display:flex;align-items:center;gap:var(--s-4);margin-bottom:var(--s-5)}
.tool-head .ic{width:46px;height:46px;border-radius:var(--r-md);display:grid;place-items:center;flex:none}
.tool-head h2{margin:0;font-size:var(--ts-5)}
.tool-head p{margin:2px 0 0;color:var(--text-muted);font-size:var(--ts-2)}
.tool-head .grow{flex:1}
.btn-ghost{border:1px solid var(--border-strong);background:var(--surface);color:var(--text);padding:9px 15px;border-radius:var(--r-sm);font-weight:500;font-size:var(--ts-2);display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn-ghost svg{width:15px;height:15px;flex:none}
.btn-ghost:hover{border-color:var(--navy-300)}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--shadow)}
.two-pane{display:grid;grid-template-columns:1fr 1fr;gap:var(--s-4)}
.pane{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow)}
.pane-head{display:flex;align-items:center;gap:var(--s-3);padding:var(--s-3) var(--s-4);border-bottom:1px solid var(--border);font-size:var(--ts-2);font-weight:600;color:var(--text-muted)}
.pane-head .lang{margin-left:auto}
.pane textarea{border:0;resize:none;padding:var(--s-4);min-height:230px;font-size:var(--ts-3);line-height:1.5;background:none;color:var(--text);width:100%}
.pane textarea:focus{outline:none}
.pane .out{padding:var(--s-4);min-height:230px;font-size:var(--ts-3);line-height:1.5;white-space:pre-wrap}
.pane-foot{display:flex;align-items:center;gap:var(--s-3);padding:var(--s-3) var(--s-4);border-top:1px solid var(--border)}
.pane-foot .muted{color:var(--text-muted);font-size:var(--ts-1);margin-right:auto}
select.sel{border:1px solid var(--border-strong);background:var(--surface);color:var(--text);padding:6px 10px;border-radius:var(--r-sm);font-size:var(--ts-2);font-weight:500}
.swap{position:relative;display:grid;place-items:center}
.swap button{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;background:var(--surface);border:1px solid var(--border-strong);width:40px;height:40px;border-radius:var(--r-pill);color:var(--navy-500);box-shadow:var(--shadow)}
.toolbar{display:flex;align-items:center;gap:var(--s-3);margin-top:var(--s-4)}

/* query bar (green = query layer) */
.qbar{position:relative;margin-bottom:var(--s-4)}
.qbar svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--green-600)}
.qbar input{width:100%;padding:14px 16px 14px 46px;border-radius:var(--r-md);border:1.5px solid var(--border-strong);background:var(--surface);color:var(--text);font-size:var(--ts-3)}
.qbar input:focus{outline:none;border-color:var(--green-500);box-shadow:0 0 0 4px var(--green-100)}
.filter-row{display:flex;gap:var(--s-2);flex-wrap:wrap;margin-bottom:var(--s-5)}
.mini-sel{border:1px solid var(--border-strong);background:var(--surface);color:var(--text);padding:7px 12px;border-radius:var(--r-pill);font-size:var(--ts-2);font-weight:500}

/* result rows */
.res-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--s-3)}
.res-head b{font-size:var(--ts-3)}
.res-head .muted{color:var(--text-muted);font-size:var(--ts-2)}
.result{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:var(--s-4) var(--s-5);box-shadow:var(--shadow);margin-bottom:var(--s-3);cursor:pointer;transition:border-color .12s,transform .12s}
.result:hover{border-color:var(--border-strong);transform:translateX(2px)}
.result .r-top{display:flex;align-items:center;gap:var(--s-3);margin-bottom:6px}
.result h4{margin:0;font-size:var(--ts-3);font-weight:600;flex:1}
.result p{margin:0;color:var(--text-muted);font-size:var(--ts-2);line-height:1.45}
.result .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:var(--s-3)}
.tag{font-size:var(--ts-1);font-weight:500;color:var(--navy-500);background:var(--blue-100);padding:2px 9px;border-radius:var(--r-pill)}
.tag.doc{color:var(--green-600);background:var(--green-100)}
.match{font-family:var(--font-mono);font-size:var(--ts-2);font-weight:500;color:var(--green-600);background:var(--green-100);padding:3px 9px;border-radius:var(--r-pill);flex:none}
.simbar{height:6px;border-radius:var(--r-pill);background:var(--surface-2);overflow:hidden;margin-top:var(--s-3);width:100%}
.simbar i{display:block;height:100%;background:var(--green-500)}

/* drop zone */
.drop{border:1.5px dashed var(--border-strong);border-radius:var(--r-md);background:var(--surface);padding:var(--s-6);text-align:center;color:var(--text-muted);cursor:pointer;transition:border-color .12s,background .12s}
.drop:hover{border-color:var(--green-500);background:var(--green-100)}
.drop svg{width:30px;height:30px;color:var(--navy-300);margin-bottom:var(--s-2)}
.drop b{color:var(--text);display:block;font-size:var(--ts-3);margin-bottom:2px}
.drop small{font-size:var(--ts-1)}
.slot{position:relative}
.slot .filed{display:flex;align-items:center;gap:var(--s-3);padding:var(--s-4);border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface)}
.slot .filed .fi{width:36px;height:36px;border-radius:var(--r-sm);background:var(--green-100);color:var(--green-600);display:grid;place-items:center;flex:none}
.slot .filed .meta{flex:1;min-width:0}
.slot .filed b{font-size:var(--ts-2);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .filed small{color:var(--text-muted);font-size:var(--ts-1)}

/* chat */
.chat{display:flex;flex-direction:column;height:calc(100vh - 210px);min-height:460px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:var(--r-pill);padding:3px;gap:2px;margin-bottom:var(--s-4)}
.seg button{border:0;background:none;color:var(--text-muted);padding:6px 14px;border-radius:var(--r-pill);font-size:var(--ts-2);font-weight:500}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.thread{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:var(--s-4);padding:var(--s-2) var(--s-1)}
.msg{max-width:76%;padding:var(--s-3) var(--s-4);border-radius:var(--r-md);font-size:var(--ts-3);line-height:1.5}
.msg.u{align-self:flex-end;background:var(--navy-900);color:#fff;border-bottom-right-radius:var(--r-xs)}
.msg.a{align-self:flex-start;background:var(--surface);border:1px solid var(--border);border-bottom-left-radius:var(--r-xs)}
.msg .src{display:inline-flex;align-items:center;gap:5px;margin-top:var(--s-3);font-size:var(--ts-1);color:var(--green-600);background:var(--green-100);padding:3px 9px;border-radius:var(--r-pill);font-weight:500}
.prompts{display:flex;gap:var(--s-2);flex-wrap:wrap;margin-top:var(--s-3)}
.prompts button{border:1px solid var(--border-strong);background:var(--surface);color:var(--text);padding:8px 14px;border-radius:var(--r-pill);font-size:var(--ts-2);text-align:left}
.prompts button:hover{border-color:var(--green-500);background:var(--green-100)}
.composer{display:flex;gap:var(--s-3);align-items:flex-end;margin-top:var(--s-4);border:1.5px solid var(--border-strong);border-radius:var(--r-md);background:var(--surface);padding:var(--s-3)}
.composer:focus-within{border-color:var(--green-500);box-shadow:0 0 0 4px var(--green-100)}
.composer textarea{flex:1;border:0;resize:none;background:none;color:var(--text);font-size:var(--ts-3);max-height:120px;padding:6px}
.composer textarea:focus{outline:none}
.composer .send{background:var(--green-500);color:#fff;border:0;width:40px;height:40px;border-radius:var(--r-sm);display:grid;place-items:center;flex:none}
.composer .send:hover{background:var(--green-600)}

/* topics */
.topics{display:flex;flex-wrap:wrap;gap:var(--s-2);margin-bottom:var(--s-5)}
.topic{border:1px solid var(--border);background:var(--surface);border-radius:var(--r-pill);padding:6px 14px;font-size:var(--ts-2);font-weight:500;display:inline-flex;gap:8px;align-items:center}
.topic .w{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}
.tlist .trow{display:flex;align-items:center;gap:var(--s-4);padding:var(--s-3) 0;border-bottom:1px solid var(--border)}
.tlist .trow:last-child{border-bottom:0}
.tlist .trow b{width:170px;font-size:var(--ts-2);font-weight:600}
.tlist .trow .bar{flex:1;height:8px;border-radius:var(--r-pill);background:var(--surface-2);overflow:hidden}
.tlist .trow .bar i{display:block;height:100%;background:var(--navy-500)}
.tlist .trow .pct{font-family:var(--font-mono);font-size:var(--ts-2);color:var(--text-muted);width:44px;text-align:right}

/* diff */
.legend{display:flex;gap:var(--s-4);margin-bottom:var(--s-3);font-size:var(--ts-2);color:var(--text-muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.diff{font-family:var(--font-mono);font-size:var(--ts-2);line-height:1.7;padding:var(--s-4);overflow:auto}
.diff .l{display:block;padding:1px 8px;border-radius:var(--r-xs);white-space:pre-wrap}
.diff .add{background:var(--add);color:var(--add-t)}
.diff .del{background:var(--del);color:var(--del-t);text-decoration:line-through;opacity:.9}

/* table */
.tbl{width:100%;border-collapse:collapse;font-size:var(--ts-2)}
.tbl th{text-align:left;color:var(--text-muted);font-weight:600;font-size:var(--ts-1);text-transform:uppercase;letter-spacing:.04em;padding:var(--s-3) var(--s-4);border-bottom:1px solid var(--border)}
.tbl td{padding:var(--s-4);border-bottom:1px solid var(--border)}
.tbl tr:last-child td{border-bottom:0}
.tbl tr:hover td{background:var(--surface-2)}
.badge-s{font-size:var(--ts-1);font-weight:600;padding:2px 9px;border-radius:var(--r-pill)}
.badge-s.ok{color:var(--green-600);background:var(--green-100)}
.badge-s.pend{color:#b58318;background:#fbeede}
:root[data-theme="dark"] .badge-s.pend{background:#3a2c14;color:#e2b466}

/* KB cards */
.src{display:flex;align-items:center;gap:var(--s-4);padding:var(--s-4) var(--s-5);border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface);box-shadow:var(--shadow);margin-bottom:var(--s-3)}
.src .ic{width:42px;height:42px;border-radius:var(--r-md);background:var(--blue-100);color:var(--blue-500);display:grid;place-items:center;flex:none}
.src .meta{flex:1}
.src .meta b{font-size:var(--ts-3);font-weight:600;display:block}
.src .meta small{color:var(--text-muted);font-size:var(--ts-2)}
.toggle{width:40px;height:23px;border-radius:var(--r-pill);background:var(--border-strong);position:relative;border:0;flex:none}
.toggle.on{background:var(--green-500)}
.toggle::after{content:"";position:absolute;width:17px;height:17px;border-radius:50%;background:#fff;top:3px;left:3px;transition:left .15s}
.toggle.on::after{left:20px}

/* ============ Rex 360 — token-driven, aligned with hub components ============ */
/* Rex 360 identity = blue: remap the query-layer accent for the whole tool */
.tool-rex{--green-500:var(--blue-500);--green-600:var(--blue-600);--green-100:var(--blue-100)}

/* Shared search bar — one component for both the landing and the results state */
.rex-searchbar{display:flex;align-items:center;background:var(--surface);border:1.5px solid var(--border-strong);border-radius:var(--r-md);box-shadow:var(--shadow);overflow:hidden;height:52px}
.rex-searchbar:focus-within{border-color:var(--green-500);box-shadow:0 0 0 4px var(--green-100),var(--shadow)}
.rex-searchbar.lg{height:56px;border-radius:var(--r-lg);margin:var(--s-6) auto 0;max-width:640px}
.rex-sb-filter{display:inline-flex;align-items:center;gap:var(--s-2);height:100%;padding:0 var(--s-4);background:transparent;border:0;border-right:1px solid var(--border);cursor:pointer;font-size:var(--ts-2);font-weight:600;color:var(--text)}
.rex-sb-filter:hover{background:var(--surface-2)}
.rex-sb-filter svg{width:16px;height:16px;color:var(--green-600)}
.rex-sb-field{flex:1;display:flex;align-items:center;padding:0 var(--s-4);min-width:0}
.rex-sb-field input{border:0;outline:none;font-size:var(--ts-3);color:var(--text);width:100%;background:transparent}
.rex-sb-field input::placeholder{color:var(--text-muted)}
.rex-sb-chat{display:inline-flex;align-items:center;gap:var(--s-2);height:100%;padding:0 var(--s-4);background:transparent;border:0;border-left:1px solid var(--border);cursor:pointer;font-size:var(--ts-2);font-weight:600;color:var(--text)}
.rex-sb-chat:hover{background:var(--surface-2)}
.rex-sb-chat .ci{width:20px;height:20px;border-radius:var(--r-pill);background:var(--green-100);display:grid;place-items:center}
.rex-sb-chat .ci svg{width:12px;height:12px;color:var(--green-600)}
.rex-sb-go{height:100%;padding:0 var(--s-5);background:var(--green-500);border:0;cursor:pointer;display:grid;place-items:center;color:#fff}
.rex-sb-go:hover{background:var(--green-600)}
.rex-sb-go svg{width:19px;height:19px}

/* Landing state */
.rex-hero{max-width:760px;margin:0 auto;text-align:center;padding:var(--s-2) 0 var(--s-5)}
.rex-hero .icon-lg{width:60px;height:60px;border-radius:var(--r-lg);background:var(--navy-900);color:#fff;display:inline-grid;place-items:center;box-shadow:var(--shadow);margin-bottom:var(--s-5)}
:root[data-theme="dark"] .rex-hero .icon-lg{background:var(--surface-2);color:var(--navy-300)}
.rex-hero h1{font-size:var(--ts-5);font-weight:700;letter-spacing:-.02em;margin:0 0 var(--s-3);color:var(--text)}
.rex-hero .lead{font-size:var(--ts-3);color:var(--text-muted);margin:0 auto;max-width:520px}
.rex-chatlink{margin:var(--s-4) auto 0;background:none;border:0;color:var(--green-600);font-size:var(--ts-2);font-weight:600;display:inline-flex;align-items:center;gap:var(--s-2);cursor:pointer}
.rex-chatlink:hover{text-decoration:underline}
.rex-chatlink svg{width:15px;height:15px}
.rex-label{font-size:var(--ts-1);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);margin:var(--s-7) 0 var(--s-4);text-align:left}
.rex-examples{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:var(--s-3);text-align:left}
.rex-ex{display:flex;align-items:flex-start;gap:var(--s-3);background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:var(--s-4);cursor:pointer;text-align:left;box-shadow:var(--shadow);transition:transform .12s,box-shadow .12s,border-color .12s}
.rex-ex:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift);border-color:var(--border-strong)}
.rex-ex .ico{width:34px;height:34px;border-radius:var(--r-sm);background:var(--green-100);color:var(--green-600);flex:none;display:grid;place-items:center}
.rex-ex .ico svg{width:17px;height:17px}
.rex-ex .b{flex:1;min-width:0}
.rex-ex .q{font-size:var(--ts-2);font-weight:600;color:var(--text);margin:0 0 var(--s-1);line-height:1.35}
.rex-ex .meta{font-size:var(--ts-1);color:var(--text-muted)}
.rex-ex .go{color:var(--text-muted);opacity:0;transition:opacity .12s,transform .12s;flex:none;margin-top:2px}
.rex-ex:hover .go{opacity:1;transform:translateX(2px);color:var(--green-600)}
.rex-ex .go svg{width:16px;height:16px}
/* Home body — wider than the hero, uses the full content width */
.rex-home-body{max-width:1180px;margin:0 auto}
.rex-panels{display:grid;grid-template-columns:1.35fr 1fr;gap:var(--s-4);margin-top:var(--s-7);align-items:start}
@media(max-width:900px){.rex-panels{grid-template-columns:1fr}}
.rex-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--shadow);overflow:hidden;text-align:left}
.rex-phead{display:flex;align-items:center;gap:var(--s-3);padding:var(--s-4) var(--s-5);border-bottom:1px solid var(--border)}
.rex-phead .pi{width:32px;height:32px;border-radius:var(--r-sm);background:var(--green-100);color:var(--green-600);display:grid;place-items:center;flex:none}
.rex-phead .pi svg{width:16px;height:16px}
.rex-phead h3{margin:0;font-size:var(--ts-3);font-weight:700;color:var(--text)}
.rex-phead p{margin:1px 0 0;font-size:var(--ts-1);color:var(--text-muted)}
.rex-phead .plink{margin-left:auto;font-size:var(--ts-2);font-weight:600;color:var(--green-600);background:none;border:0;cursor:pointer;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.rex-phead .plink:hover{text-decoration:underline}
.rex-phead .plink svg{width:14px;height:14px}

/* Stat strip */
.rex-stats{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--border)}
.rex-stat{padding:var(--s-4) var(--s-5);border-right:1px solid var(--border)}
.rex-stat:last-child{border-right:0}
.rex-stat b{display:block;font-family:var(--font-mono);font-size:var(--ts-4);font-weight:500;color:var(--text);letter-spacing:-.02em}
.rex-stat span{font-size:var(--ts-1);color:var(--text-muted)}

/* Recent REX rows */
.rex-newlist{display:flex;flex-direction:column}
.rex-nrow{display:flex;align-items:center;gap:var(--s-3);padding:var(--s-3) var(--s-5);border-bottom:1px solid var(--border);cursor:pointer;text-align:left;background:none;border-left:0;border-right:0;border-top:0;width:100%}
.rex-nrow:last-child{border-bottom:0}
.rex-nrow:hover{background:var(--surface-2)}
.rex-ndot{width:8px;height:8px;border-radius:50%;flex:none}
.rex-ndot.success{background:var(--ok)}.rex-ndot.issue{background:var(--issue)}
.rex-nbody{flex:1;min-width:0}
.rex-ntitle{font-size:var(--ts-2);font-weight:600;color:var(--text);margin:0 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rex-nmeta{font-size:var(--ts-1);color:var(--text-muted);display:flex;gap:var(--s-2);flex-wrap:wrap}
.rex-nmeta .sep{opacity:.5}
.rex-ndate{font-family:var(--font-mono);font-size:var(--ts-1);color:var(--text-muted);flex:none}

/* Product updates timeline */
.rex-updates{padding:var(--s-4) var(--s-5) var(--s-5)}
.rex-up{display:flex;gap:var(--s-3);padding-bottom:var(--s-4)}
.rex-up:last-child{padding-bottom:0}
.rex-uprail{display:flex;flex-direction:column;align-items:center;flex:none;width:14px}
.rex-updot{width:10px;height:10px;border-radius:50%;margin-top:4px;flex:none;border:2px solid var(--surface)}
.rex-updot.shipped{background:var(--ok)}
.rex-updot.progress{background:var(--green-500)}
.rex-updot.next{background:var(--border-strong)}
.rex-upline{width:2px;flex:1;background:var(--border);margin-top:2px}
.rex-up:last-child .rex-upline{display:none}
.rex-upbody{flex:1;min-width:0;padding-bottom:var(--s-1)}
.rex-uptag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px var(--s-2);border-radius:var(--r-pill);margin-bottom:5px}
.rex-uptag.shipped{background:var(--ok-bg);color:var(--ok)}
.rex-uptag.progress{background:var(--green-100);color:var(--green-600)}
.rex-uptag.next{background:var(--surface-2);color:var(--text-muted)}
.rex-uptitle{font-size:var(--ts-2);font-weight:600;color:var(--text);margin:0 0 2px}
.rex-uptext{font-size:var(--ts-1);color:var(--text-muted);margin:0;line-height:1.45}
.rex-upfoot{border-top:1px solid var(--border);padding:var(--s-3) var(--s-5);display:flex;align-items:center;gap:var(--s-3)}
.rex-upfoot .btn-ghost{flex:1;justify-content:center}
.rex-updates-teaser{padding:var(--s-5);display:flex;flex-direction:column;align-items:flex-start;gap:var(--s-4)}
.rex-updates-teaser p{margin:0;font-size:var(--ts-2);color:var(--text-muted);line-height:1.5}

.rex-caps{margin-top:var(--s-7);border-top:1px solid var(--border);padding-top:var(--s-5)}
.rex-caps-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:var(--s-5)}
.rex-cap{text-align:left}
.rex-cap .ci{width:30px;height:30px;border-radius:var(--r-sm);background:var(--surface-2);color:var(--text-muted);display:grid;place-items:center;margin-bottom:var(--s-2)}
.rex-cap .ci svg{width:16px;height:16px}
.rex-cap h4{font-size:var(--ts-2);font-weight:700;color:var(--text);margin:0 0 var(--s-1)}
.rex-cap p{font-size:var(--ts-1);color:var(--text-muted);margin:0;line-height:1.4}

/* Results state */
.rx-app{display:flex;gap:var(--s-5);align-items:flex-start;margin-top:var(--s-2)}
.rx-filters{width:280px;flex:none;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--shadow);overflow:hidden;position:sticky;top:calc(65px + var(--s-5))}
.rx-filters.hidden{display:none}
.rx-fhead{display:flex;align-items:center;justify-content:space-between;padding:var(--s-4) var(--s-4) var(--s-3)}
.rx-fhead h3{font-size:var(--ts-3);font-weight:700;margin:0;color:var(--text)}
.rx-divider{height:1px;background:var(--border);margin:0 var(--s-4)}
.rx-maxres{padding:var(--s-4)}
.rx-lbl{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:var(--s-3)}
.rx-lbl span{font-size:var(--ts-2);font-weight:600;color:var(--text)}
.rx-lbl b{font-family:var(--font-mono);font-size:var(--ts-2);font-weight:500;color:var(--text)}
.rx-maxres input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:var(--r-pill);background:linear-gradient(var(--green-500),var(--green-500)) 0/var(--fill,50%) 100% no-repeat,var(--surface-2);outline:none;cursor:pointer}
.rx-maxres input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--green-500);border:3px solid var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.3)}
.rx-maxres input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--green-500);border:3px solid var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.3)}
.rx-sections{padding:var(--s-1) var(--s-4) var(--s-2);display:flex;flex-direction:column;gap:var(--s-2)}
.rx-sec{border:1px solid var(--border);border-radius:var(--r-sm);overflow:hidden}
.rx-sec.open{border-color:var(--border-strong)}
.rx-secbtn{width:100%;display:flex;align-items:center;gap:var(--s-2);padding:var(--s-3);background:transparent;border:0;cursor:pointer;text-align:left}
.rx-secbtn:hover{background:var(--surface-2)}
.rx-secbtn .t{font-size:var(--ts-2);font-weight:600;color:var(--text);flex:1}
.rx-count{min-width:19px;height:19px;padding:0 6px;border-radius:var(--r-pill);background:var(--green-500);color:#fff;font-size:var(--ts-1);font-weight:600;display:inline-flex;align-items:center;justify-content:center}
.rx-chev{width:15px;height:15px;color:var(--text-muted);transition:transform .2s;flex:none}
.rx-sec.open .rx-chev{transform:rotate(180deg)}
.rx-sbody{padding:0 var(--s-3) var(--s-3);display:none}
.rx-sec.open .rx-sbody{display:block}
.rx-fsearch{position:relative;margin-bottom:var(--s-1)}
.rx-fsearch svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--green-600)}
.rx-fsearch input{width:100%;padding:var(--s-2) var(--s-3) var(--s-2) 32px;border:1px solid var(--border-strong);border-radius:var(--r-sm);font-size:var(--ts-2);color:var(--text);background:var(--surface)}
.rx-fsearch input:focus{outline:none;border-color:var(--green-500);box-shadow:0 0 0 3px var(--green-100)}
.rx-clear{display:block;margin:var(--s-2) 0 var(--s-1) auto;font-size:var(--ts-1);font-weight:600;color:var(--green-600);background:none;border:0;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.rx-opt{display:flex;align-items:flex-start;gap:var(--s-2);padding:var(--s-2);border-radius:var(--r-sm);cursor:pointer}
.rx-opt:hover{background:var(--surface-2)}
.rx-opt.sel{background:var(--green-100)}
.rx-box{width:17px;height:17px;border-radius:var(--r-xs);border:1.5px solid var(--border-strong);background:var(--surface);flex:none;margin-top:1px;display:grid;place-items:center}
.rx-opt.sel .rx-box{background:var(--green-500);border-color:var(--green-500)}
.rx-box svg{width:11px;height:11px;color:#fff;opacity:0}
.rx-opt.sel .rx-box svg{opacity:1}
.rx-opt .t{font-size:var(--ts-2);color:var(--text);line-height:1.35}
.rx-optempty{font-size:var(--ts-2);color:var(--text-muted);margin:2px 0 0}
.rx-ffoot{padding:var(--s-3) var(--s-4) var(--s-4);border-top:1px solid var(--border)}
.rx-ffoot .btn-ghost{width:100%;justify-content:center}
.rx-main{flex:1;min-width:0}
.rx-timestamp{font-size:var(--ts-1);color:var(--text-muted);margin:var(--s-2) 2px 0}
.rx-tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin:var(--s-5) 0 var(--s-5)}
.rx-tab{display:inline-flex;align-items:center;gap:var(--s-2);padding:var(--s-3) var(--s-4);background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;font-size:var(--ts-2);font-weight:600;color:var(--text-muted)}
.rx-tab:hover{color:var(--text)}
.rx-tab.active{color:var(--green-600);border-bottom-color:var(--green-500)}
.rx-tcount{min-width:20px;height:20px;padding:0 6px;border-radius:var(--r-pill);font-size:var(--ts-1);font-weight:600;display:inline-flex;align-items:center;justify-content:center;background:var(--surface-2);color:var(--text-muted)}
.rx-tab.active .rx-tcount{background:var(--green-500);color:#fff}
.rx-sectitle{font-size:var(--ts-4);font-weight:700;color:var(--text);margin:0 0 var(--s-4);letter-spacing:-.01em}
.rx-sectitle.withlink{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s-4);flex-wrap:wrap}
.rx-toolsrow{display:flex;align-items:center;gap:var(--s-3);margin-left:auto;flex-wrap:wrap;row-gap:var(--s-2)}
.rx-relink{font-size:var(--ts-2);font-weight:500;color:var(--text-muted);text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.rx-relink:hover{color:var(--text)}
.rx-sort{position:relative}
.rx-sort .btn-ghost svg:first-child{color:var(--text-muted)}
.rx-sort .btn-ghost svg:last-child{width:12px;height:12px;margin-left:2px;color:var(--text-muted)}
.rx-sortmenu{position:absolute;top:calc(100% + 6px);right:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--shadow-lift);padding:6px;min-width:180px;display:none;flex-direction:column;gap:1px;z-index:8}
.rx-sortmenu.open{display:flex}
.rx-sortmenu button{border:0;background:none;text-align:left;padding:8px 10px;border-radius:var(--r-sm);font-size:var(--ts-2);color:var(--text);cursor:pointer}
.rx-sortmenu button:hover{background:var(--surface-2)}

/* Quality score — signal bars + label */
.rx-qual{display:inline-flex;align-items:center;gap:var(--s-2);flex:none;white-space:nowrap}

.rx-scrim{position:fixed;inset:0;background:rgba(9,18,33,.34);opacity:0;pointer-events:none;transition:opacity .2s;z-index:55}

<body>
<div class="app">
  <aside class="sidebar" id="sidebar">

      <div class="user"><div class="avatar">TL</div><div><b>Tender Leader</b><small>Signed in</small></div></div>

      <button class="icon-btn menu-toggle" id="menuBtn" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>

</div>
<div class="toast" id="toast"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6 9 17l-5-5"/></svg><span id="toastMsg"></span></div>

<script>
/* ================= Data ================= */
const ICONS={
  srm:'<path d="M9 11l3 3 8-8M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/>',
  rex360:'<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3M11 8v6M8 11h6"/>',
  rexbook:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>',
  similar:'<rect x="3" y="3" width="9" height="9" rx="1"/><rect x="12" y="12" width="9" height="9" rx="1"/><path d="M12 7h4a2 2 0 0 1 2 2v3"/>',
  compare:'<path d="M12 3v18M5 8l-3 4 3 4M19 8l3 4-3 4"/>',
  versions:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 8v4l3 2"/>',
  topics:'<path d="M4 6h16M4 12h10M4 18h7"/><circle cx="19" cy="15" r="3"/>',
  dupes:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M4 16V6a2 2 0 0 1 2-2h10"/><path d="M12 12h4M12 16h4"/>',
  chatbot:'<path d="M21 15a2 2 0 0 1-2 2H8l-4 4V5a2 2 0 0 1 2-2h13a2 2 0 0 1 2 2z"/><path d="M8 10h8M8 13h5"/>',
  kb:'<path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 12l9 5 9-5M3 17l9 5 9-5"/>',
  translate:'<path d="M4 5h9M8 3v2c0 4-2 7-5 9M5 9c0 3 3 5 6 6"/><path d="M13 21l4-9 4 9M14.5 17h5"/>',
  upload:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>'
};
const TOOLS=[
  {id:'rex360',name:'Rex 360',cat:'rex',icon:'rex360',desc:'Search the REX base for similar past experiences and lessons learned.'},
  {id:'rexbook',name:'Rexbook',cat:'rex',icon:'rexbook',desc:'Upload new REX and browse your full upload history.'},
  {id:'similar',name:'Similar Documents',cat:'documents',icon:'similar',desc:'Find documents that are textually close to a reference file.'},
  {id:'compare',name:'Compare Two Docs',cat:'documents',icon:'compare',desc:'Line up two documents and see where they differ and overlap.'},
  {id:'versions',name:'Compare Versions',cat:'documents',icon:'versions',desc:'Track exactly what changed between versions of one document.'},
  {id:'topics',name:'Extract Topics',cat:'documents',icon:'topics',desc:'Surface the key topics and themes across a document set.'},
  {id:'dupes',name:'Find Duplicates',cat:'documents',icon:'dupes',desc:'Detect duplicated and near-duplicated content in your corpus.'},
  {id:'chatbot',name:'Chatbot',cat:'assistants',icon:'chatbot',desc:'Ask questions against company documents or a public knowledge base.'},
  {id:'kb',name:'Knowledge Base',cat:'assistants',icon:'kb',desc:'Browse and manage the curated knowledge sources.'},
  {id:'translate',name:'Translator',cat:'assistants',icon:'translate',desc:'Translate documents and snippets while keeping their formatting.'}
];
const SOLUTIONS={srm:{id:'srm',name:'SRM',cat:'solution',icon:'srm'}};
const ALL={...Object.fromEntries(TOOLS.map(t=>[t.id,t])),...SOLUTIONS};
const CLUSTERS=[
  {id:'rex',title:'REX',sub:'Return on experience'},
  {id:'documents',title:'Document intelligence',sub:'Search, compare and clean your corpus'},
  {id:'assistants',title:'Assistants & knowledge',sub:'Everyday conversational and language tools'}
];
const CAT_LABEL={solution:'Solutions',rex:'REX',documents:'Document intelligence',assistants:'Assistants & knowledge'};

/* ================= State ================= */
function load(){try{return JSON.parse(localStorage.getItem('genai-hub')||'{}')}catch(e){return{}}}
function save(s){try{localStorage.setItem('genai-hub',JSON.stringify(s))}catch(e){}}
let state=load();
if(!Array.isArray(state.favorites))state.favorites=['srm','translate','chatbot'];
if(state.theme)document.documentElement.setAttribute('data-theme',state.theme);
let filter='all', searchTerm='';
let rexView='home', rexTerm='', rexLayout='list';

const $=s=>document.querySelector(s);
const iconSvg=(k,cls,sz=20)=>`<div class="ic ${cls}"><svg viewBox="0 0 24 24" width="${sz}" height="${sz}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[k]}</svg></div>`;
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ================= Router ================= */
function router(){
  const h=location.hash;
  rexView='home';
  document.getElementById('content').scrollIntoView?.({block:'start'});
  window.scrollTo(0,0);
  if(h.startsWith('#/tool/')){const id=h.slice(7); if(ALL[id]&&SCREENS[id]){renderTool(id);return;}}
  renderCatalogue();
}
window.addEventListener('hashchange',router);
const go=id=>{location.hash='#/tool/'+id};
const home=()=>{location.hash='';};

/* ================= Catalogue ================= */
function catCounts(){
  const c={all:TOOLS.length+1,solution:1};
  CLUSTERS.forEach(cl=>c[cl.id]=TOOLS.filter(t=>t.cat===cl.id).length);
  return c;
}
function renderCatalogue(){
  $('#navHome').classList.add('active');
  $('#topbarRight').innerHTML='';
  $('#topbarLeft').innerHTML=`<div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="search" type="text" placeholder="Search tools and solutions…" aria-label="Search tools" value="${esc(searchTerm)}">
      <kbd>/</kbd></div>`;
  $('#search').addEventListener('input',e=>{searchTerm=e.target.value;drawCatalogue()});
  drawCatalogue(true);
}
function drawCatalogue(full){
  const c=catCounts();
  const term=searchTerm.trim().toLowerCase();
  const chips=[['all','All'],['solution','Solutions'],['rex','REX'],['documents','Documents'],['assistants','Assistants']]
    .map(([k,l])=>`<button class="chip-filter ${filter===k?'active':''}" data-filter="${k}">${l}<span class="n">${c[k]}</span></button>`).join('');

  let html=`<div class="page-head"><h2>All tools</h2><p>One place for every AI tool. Open a full solution, or pin the small tools you use most to your sidebar.</p></div>
    <div class="filters">${chips}</div>`;

SCREEN_INIT.rex360=()=>{
  const submit=t=>{rexTerm=(t||'').trim()||'REX';rexView='results';renderTool('rex360');};
  // drawer bindings — shared by both states
  document.querySelectorAll('[data-detail]').forEach(b=>b.addEventListener('click',()=>rxOpenDetail(b.dataset.detail)));

  $('#rx-expand').addEventListener('click',()=>{const w=$('#rx-drawer').classList.toggle('wide');$('#rx-expand').querySelector('.lbl').textContent=w?'Collapse':'Expand';});
  // in-context chat — shared by both states
  $('#rx-chat-close').addEventListener('click',rxCloseChat);
  $('#rx-chat-scrim').addEventListener('click',rxCloseChat);
  $('#rx-chat-send').addEventListener('click',()=>rxChatAsk($('#rx-chat-input').value));
  $('#rx-chat-input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();rxChatAsk($('#rx-chat-input').value);}});
  if(rexView==='home'){
    const q=$('#rex-q');
    $('#rex-go').addEventListener('click',()=>submit(q.value));
    q.addEventListener('keydown',e=>{if(e.key==='Enter')submit(q.value)});
    $('#rex-filter').addEventListener('click',()=>toast('Filters (prototype)'));
    document.querySelectorAll('.rex-ex').forEach(el=>el.addEventListener('click',()=>submit(el.dataset.q)));
    $('#rex-seeall').addEventListener('click',()=>submit('added this month'));
    $('#rex-follow').addEventListener('click',()=>toast('You will be notified of Rex 360 updates'));
    $('#rex-chat-btn').addEventListener('click',()=>rxOpenChat(q.value));
    $('#rex-updates-open').addEventListener('click',rxOpenUpdates);
    $('#rx-updates-close').addEventListener('click',rxCloseUpdates);
    $('#rx-updates-scrim').addEventListener('click',rxCloseUpdates);
  }else{
    const q=$('#rex-q2');
    q.addEventListener('keydown',e=>{if(e.key==='Enter')submit(q.value)});
    $('#rex-go2').addEventListener('click',()=>submit(q.value));
    $('#rex-chat-btn').addEventListener('click',()=>rxOpenChat(q.value));
    const fpanel=$('#rx-filters'),tgl=()=>fpanel.classList.toggle('hidden');
    $('#rx-togglefilters').addEventListener('click',tgl);
    $('#rx-collapse').addEventListener('click',tgl);
    const sl=$('#rx-slider'),mv=$('#rx-maxval'),updfill=()=>{const p=(sl.value-sl.min)/(sl.max-sl.min)*100;sl.style.setProperty('--fill',p+'%');mv.textContent=sl.value;};
    sl.addEventListener('input',updfill);updfill();
    document.querySelectorAll('.rx-secbtn').forEach(b=>b.addEventListener('click',()=>b.closest('.rx-sec').classList.toggle('open')));
    document.querySelectorAll('.rx-opt').forEach(o=>o.addEventListener('click',()=>o.classList.toggle('sel')));
    document.querySelectorAll('.rx-tab').forEach(t=>t.addEventListener('click',()=>{document.querySelectorAll('.rx-tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');}));
    document.querySelectorAll('#rx-viewtog button').forEach(b=>b.addEventListener('click',()=>{rexLayout=b.dataset.view;renderTool('rex360');}));
    const syncSel=()=>{
      const n=document.querySelectorAll('.rx-lrow.sel').length,bar=$('#rx-selbar');
      if(!bar)return;bar.style.display=n?'flex':'none';
      $('#rx-selcount').textContent=n+(n===1?' REX selected':' REX selected');
      const dl=$('#rx-seldownload');if(dl)dl.querySelector('span').textContent=`Download selection (${n})`;
    };
    document.querySelectorAll('[data-check]').forEach(c=>{
      const toggle=e=>{e.stopPropagation();const row=c.closest('.rx-lrow');const on=row.classList.toggle('sel');c.setAttribute('aria-checked',on);syncSel();};
      c.addEventListener('click',toggle);
      c.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();toggle(e);}});
    });
    $('#rx-selclear')?.addEventListener('click',()=>{document.querySelectorAll('.rx-lrow.sel').forEach(r=>{r.classList.remove('sel');r.querySelector('[data-check]')?.setAttribute('aria-checked','false');});syncSel();});
    $('#rx-seldownload')?.addEventListener('click',()=>{const n=document.querySelectorAll('.rx-lrow.sel').length;toast(`Preparing download of ${n} REX…`);});
    const sortBtn=$('#rx-sortbtn'),sortMenu=$('#rx-sortmenu');

      });

    $('#rx-downloadall')?.addEventListener('click',()=>toast('Preparing download of 16 REX…'));
  }
};

/* ================= Favorites ================= */
function renderFavs(){
  const list=$('#favList');list.innerHTML='';
  $('#favCount').textContent=state.favorites.length;
  if(!state.favorites.length){list.innerHTML='<div class="fav-empty">No favorites yet. Tap the star on any tool to pin it here.</div>';return;}
  state.favorites.forEach(id=>{
    const t=ALL[id];if(!t)return;
    const row=document.createElement('div');
    row.className='fav';row.draggable=true;row.dataset.id=id;row.title=t.name;
    row.innerHTML=`<span class="grip"><svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg></span>
      <div class="ic t-${t.cat}" style="width:26px;height:26px"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[t.icon]}</svg></div>
      <span class="nm">${t.name}</span>
      <button class="unpin" data-pin="${id}" aria-label="Unpin ${t.name}"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>`;
    row.addEventListener('click',e=>{if(!e.target.closest('.unpin')&&!e.target.closest('.grip'))go(id);});
    list.appendChild(row);
  });
  bindDrag();
}
function togglePin(id){
  const i=state.favorites.indexOf(id);
  if(i>-1){state.favorites.splice(i,1);toast(`${ALL[id].name} unpinned`);}
  else{state.favorites.push(id);toast(`${ALL[id].name} pinned to sidebar`);}
  save(state);renderFavs();
  // refresh current view pin states
  if(location.hash.startsWith('#/tool/'))renderTool(location.hash.slice(7));else drawCatalogue();
}
let dragId=null;
function bindDrag(){
  document.querySelectorAll('.fav').forEach(row=>{
    row.addEventListener('dragstart',e=>{dragId=row.dataset.id;row.classList.add('dragging');e.dataTransfer.effectAllowed='move';});
    row.addEventListener('dragend',()=>{dragId=null;document.querySelectorAll('.fav').forEach(r=>r.classList.remove('dragging','drop-target'));});
    row.addEventListener('dragover',e=>{e.preventDefault();if(row.dataset.id!==dragId)row.classList.add('drop-target');});
    row.addEventListener('dragleave',()=>row.classList.remove('drop-target'));
    row.addEventListener('drop',e=>{e.preventDefault();row.classList.remove('drop-target');
      if(!dragId||row.dataset.id===dragId)return;
      const f=state.favorites;f.splice(f.indexOf(dragId),1);f.splice(f.indexOf(row.dataset.id),0,dragId);
      save(state);renderFavs();});
  });
}

/* ================= Global events ================= */
let toastT;
function toast(msg){$('#toastMsg').textContent=msg;const t=$('#toast');t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1900);}
function toggleTheme(){const cur=document.documentElement.getAttribute('data-theme');const next=cur==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',next);state.theme=next;save(state);setThemeIcon(next);}
function setThemeIcon(t){$('#themeIcon').innerHTML=t==='dark'?'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>':'<path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/>';}

document.addEventListener('click',e=>{
  const pin=e.target.closest('[data-pin]');if(pin){e.stopPropagation();togglePin(pin.dataset.pin);return;}
  const filt=e.target.closest('[data-filter]');if(filt){filter=filt.dataset.filter;drawCatalogue();return;}
  const reset=e.target.closest('[data-reset]');if(reset){filter='all';searchTerm='';renderCatalogue();return;}
  const copy=e.target.closest('[data-copy]');if(copy){const el=document.getElementById(copy.dataset.copy);navigator.clipboard?.writeText(el.textContent);toast('Copied to clipboard');return;}
  const tst=e.target.closest('[data-toast]');if(tst){toast(tst.dataset.toast);return;}
  const open=e.target.closest('[data-open]');if(open){toast(`Opening ${open.dataset.open}…`);return;}
  const card=e.target.closest('[data-go]');if(card){go(card.dataset.go);return;}
});
function setCollapsed(on){
  document.documentElement.setAttribute('data-collapsed',on?'1':'0');
  const b=$('#collapseBtn');b.title=on?'Expand sidebar':'Collapse sidebar';b.setAttribute('aria-label',b.title);
  state.collapsed=on;save(state);
}
$('#collapseBtn').addEventListener('click',()=>setCollapsed(document.documentElement.getAttribute('data-collapsed')!=='1'));
$('#navHome').addEventListener('click',home);
$('#brand').addEventListener('click',home);
$('#themeBtn').addEventListener('click',toggleTheme);
$('#menuBtn').addEventListener('click',()=>$('#sidebar').classList.toggle('open'));
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){const d=document.getElementById('rx-drawer');if(d&&d.classList.contains('open')){rxCloseDetail();return;}}
  if(e.key==='Escape'){const d=document.getElementById('rx-updates-drawer');if(d&&d.classList.contains('open')){rxCloseUpdates();return;}}
  if(e.key==='/'&&document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='TEXTAREA'){const s=$('#search');if(s){e.preventDefault();s.focus();}}
});

/* ================= Init ================= */
setCollapsed(!!state.collapsed);renderFavs();setThemeIcon(document.documentElement.getAttribute('data-theme'));router();
</script>
